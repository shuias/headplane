server {
    listen 80;
    server_name _;

    auth_basic           "Headplane Admin";
    auth_basic_user_file /etc/nginx/users.htpasswd;

    # Security: strip any client-forged Remote-* headers so the user can't
    # spoof their identity to Headplane before we re-add them with the
    # authenticated value from Basic Auth.
    proxy_set_header Remote-User        "";
    proxy_set_header Remote-Email       "";
    proxy_set_header Remote-Name        "";
    proxy_set_header Remote-Picture     "";

    # Re-inject the authenticated user identity so Headplane's Proxy Auth
    # mode can pick it up.
    proxy_set_header Remote-User        $remote_user;
    proxy_set_header Remote-Name        $remote_user;

    # Standard reverse-proxy headers — these are required so Headplane's
    # OIDC/redirect helpers and cookie handling know the real origin.
    proxy_set_header Host               $http_host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Port   $server_port;

    # Long timeouts — Headplane does streaming/SSH so we don't want to drop.
    proxy_read_timeout                  1h;
    proxy_send_timeout                  1h;

    # WebSocket + SSE support (live store uses SSE).
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    proxy_pass http://headplane:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
